{
    "on": {
        "push": {
            "branches": ["main"]
        }
    },
    "jobs": {
        "jobs_build_moz_amirali-first-task_hamravesh-c180": {
            "runs-on": "ubuntu-latest",
            "container": {
                "image": "hamravesh/darkube-cli:v1.1",
                "options": "--user root"
            },
            "env": {
                "IMAGE_NAME": "registry.hamdocker.ir/sandbox/moz"
            },
            "steps": [
                {
                    "name": "checkout commit",
                    "uses": "actions/checkout@v4"
                },
                {
                    "name": "darkube-cli build & push",
                    "run": 'darkube build --push -t $IMAGE_NAME:${GITHUB_SHA:0:7} -t $IMAGE_NAME:${GITHUB_REF_NAME} '
                            '--docker-auth-config "${{secrets.DOCKER_AUTH_CONFIG}}" '
                            '--workdir . --file ./Dockerfile --build-context .'
                }
            ]
        },
        "jobs_deploy_moz_amirali-first-task_hamravesh-c180": {
            "needs": "jobs_build_moz_amirali-first-task_hamravesh-c180",
            "runs-on": "ubuntu-latest",
            "container": "hamravesh/darkube-cli:v1.1",
            "steps": [
                {
                    "name": "darkube-cli deploy",
                    "run": 'darkube deploy '
                            '--token ${{secrets.DEPLOY_TOKEN_MOZ_AMIRALI_FIRST_TASK_HAMRAVESH_C180}} '
                            '--app-id ${{secrets.APP_ID_MOZ_AMIRALI_FIRST_TASK_HAMRAVESH_C180}} '
                            '--image-tag ${GITHUB_SHA:0:7} --job-id ${GITHUB_RUN_ID}'
                }
            ]
        }
    }
}
